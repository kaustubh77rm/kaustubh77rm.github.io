<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Morning</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0f172a;
  font-family:'Segoe UI',system-ui;
  color:#f1f5f9;
}

.hero{
  text-align:center;
  padding:2rem 1rem 1rem;
}

h1{
  font-size:2.2rem;
  background:linear-gradient(135deg,#fff,#d9c8ff,#b692f0);
  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  margin-top:0.6rem;
  opacity:0.8;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:1.2rem;
  padding:2rem 1.5rem;
  max-width:1400px;
  margin:auto;
}

.gallery img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:20px;
  cursor:pointer;
  transition:.3s;
}

.gallery img:hover{
  transform:scale(1.03);
}

/* button */
.load-more-wrapper{
  text-align:center;
  margin:1rem 0 3rem;
}

.load-more-btn{
  background:#1e293b;
  color:white;
  padding:10px 25px;
  border-radius:40px;
  cursor:pointer;
}

/* lightbox */
.lightbox{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.lightbox img{
  max-width:90%;
  max-height:85%;
  border-radius:20px;
}

/* CLOSE BUTTON */
.close-btn{
  position:absolute;
  top:20px;
  right:25px;
  font-size:2rem;
  cursor:pointer;
  background:rgba(0,0,0,0.6);
  padding:5px 12px;
  border-radius:50%;
}

.close-btn:hover{
  background:red;
}

.counter-status{
  text-align:center;
  margin-bottom:10px;
  font-size:0.9rem;
}

.end-message{
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}
</style>
</head>

<body>

<div class="hero">
  <h1>🌿 Wedding Morning 🌅</h1>
  <div class="sub">moments | soft memories</div>
</div>

<div class="gallery" id="gallery"></div>

<div class="load-more-wrapper">
  <button class="load-more-btn" id="loadMoreBtn">Load More Photos</button>
</div>

<div class="counter-status" id="counterStatus"></div>
<div class="end-message" id="endMessage"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <span class="close-btn" id="closeBtn">✖</span>
  <img id="lightbox-img">
</div>

const gallery = document.getElementById("gallery");
const btn = document.getElementById("loadMoreBtn");
const counter = document.getElementById("counterStatus");
const endMsg = document.getElementById("endMessage");

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.getElementById("closeBtn");

let index = 0;
const batch = 5;

function updateStatus(){
  counter.innerText = `Loaded ${index} / ${images.length} photos`;
  if(index >= images.length){
    btn.style.display="none";
    endMsg.innerText="All moments captured ❤️";
  }
}

function loadImages(){
  const next = images.slice(index, index + batch);
  next.forEach(src=>{
    const img=document.createElement("img");
    img.src=src;
    img.onclick=()=>{
      lightbox.style.display="flex";
      lightboxImg.src=src;
    };
    gallery.appendChild(img);
  });
  index += next.length;
  updateStatus();
}

btn.onclick = loadImages;

/* lightbox close */
closeBtn.onclick = ()=> lightbox.style.display="none";
lightbox.onclick = (e)=>{
  if(e.target===lightbox) lightbox.style.display="none";
};

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape") lightbox.style.display="none";
});

/* init */
loadImages();

</script>
