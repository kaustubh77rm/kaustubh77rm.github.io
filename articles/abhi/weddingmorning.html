<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Wedding Morning Gallery | Load More</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0f172a;
    font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
    color: #f1f5f9;
    scroll-behavior: smooth;
  }

  .hero {
    text-align: center;
    padding: 2rem 1rem 1rem;
    background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.2), transparent);
  }

  h1 {
    font-size: 2.2rem;
    background: linear-gradient(135deg, #ffffff, #d9c8ff, #b692f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .sub {
    margin-top: 0.6rem;
    opacity: 0.8;
    font-size: 1rem;
    font-weight: 300;
  }

  /* gallery grid */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.2rem;
    padding: 2rem 1.5rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .gallery img:hover {
    transform: scale(1.02);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    border-color: rgba(210, 180, 255, 0.6);
  }

  /* button container */
  .load-more-wrapper {
    display: flex;
    justify-content: center;
    margin: 1rem 1rem 3rem;
  }

  .load-more-btn {
    background: linear-gradient(105deg, #2d3a5e, #1e293b);
    border: 1px solid rgba(203, 173, 255, 0.6);
    color: #f0e9ff;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 0.85rem 2.2rem;
    border-radius: 60px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease;
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .load-more-btn:hover {
    background: linear-gradient(105deg, #3b4a70, #2a3448);
    border-color: #cbb5ff;
    transform: scale(1.02);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    color: white;
  }

  .load-more-btn:active {
    transform: scale(0.98);
  }

  .counter-status {
    text-align: center;
    font-size: 0.85rem;
    margin-top: -0.8rem;
    margin-bottom: 0.8rem;
    color: #a5b4fc;
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  /* lightbox styling */
  .lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(8, 12, 25, 0.96);
    backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    cursor: pointer;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 85%;
    border-radius: 24px;
    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 245, 215, 0.3);
    transition: transform 0.2s;
    cursor: default;
  }

  .close-btn {
    position: absolute;
    top: 24px;
    right: 32px;
    font-size: 2rem;
    font-weight: bold;
    color: #fef9e8;
    background: rgba(20, 20, 40, 0.7);
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .close-btn:hover {
    background: #c2410c;
    transform: scale(1.05);
    color: white;
  }

  /* footer / empty state */
  .end-message {
    text-align: center;
    margin: 1rem 0 2rem;
    font-size: 0.9rem;
    color: #94a3b8;
    font-style: italic;
  }

  @media (max-width: 640px) {
    .gallery {
      gap: 0.9rem;
      padding: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    h1 {
      font-size: 1.8rem;
    }
    .load-more-btn {
      padding: 0.7rem 1.6rem;
      font-size: 1rem;
    }
  }
</style>
</head>

  // DOM elements
  const galleryContainer = document.getElementById("gallery");
  const loadBtn = document.getElementById("loadMoreBtn");
  const counterSpan = document.getElementById("counterStatus");
  const endMessageDiv = document.getElementById("endMessage");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const closeBtn = document.getElementById("closeBtn");

  // pagination state
  let currentIndex = 0;          // how many images have been loaded so far
  const BATCH_SIZE = 10;         // load 10 per click
  let isLoading = false;          // prevent double-fetch while appending

  // helper: update status text (showing loaded count / total)
  function updateStatus() {
    const loaded = currentIndex;
    const total = fullImageSet.length;
    if (total === 0) {
      counterSpan.innerText = "✨ 暂无照片 ✨";
      return;
    }
    counterSpan.innerText = `📸 已加载 ${loaded} / ${total} 张 · 温柔时刻`;
    if (loaded >= total) {
      endMessageDiv.innerText = "🌸 所有婚礼影像已呈现，愿爱永驻 🌸";
      loadBtn.disabled = true;
      loadBtn.style.opacity = "0.6";
      loadBtn.style.cursor = "default";
      loadBtn.innerText = "✨ 已加载全部 ✨";
    } else {
      endMessageDiv.innerText = "";
      loadBtn.disabled = false;
      loadBtn.style.opacity = "1";
      loadBtn.innerText = `✨ 加载更多照片 +${Math.min(BATCH_SIZE, total - loaded)} ✨`;
    }
  }

  // lightbox logic (re-attach for new images? we'll use event delegation)
  function attachClickToImages() {
    // using event delegation on gallery container is safer & dynamic
    // but we also want to ensure any newly added images get click handler.
    // we already set onclick property in createImageElement, but delegation also works.
    // but to be consistent: we set onclick individually inside createImageElement.
    // no need extra.
  }

  // create single gallery image element with lightbox trigger
  function createImageElement(imgUrl) {
    const img = document.createElement("img");
    img.src = imgUrl;
    img.loading = "lazy";
    img.alt = "Wedding morning memory";
    img.style.cursor = "pointer";
    // lightbox trigger
    img.onclick = (e) => {
      e.stopPropagation();
      lightbox.style.display = "flex";
      lightboxImg.src = imgUrl;
    };
    return img;
  }

  // append next batch of images (BATCH_SIZE) to gallery
  function loadNextBatch() {
    if (isLoading) return;
    if (currentIndex >= fullImageSet.length) {
      updateStatus();
      return;
    }
    
    isLoading = true;
    // simulate micro async for smooth ui (but sync dom is fine)
    // use requestAnimationFrame to avoid blocking
    setTimeout(() => {
      const start = currentIndex;
      const end = Math.min(start + BATCH_SIZE, fullImageSet.length);
      const fragment = document.createDocumentFragment();
      
      for (let i = start; i < end; i++) {
        const imgElement = createImageElement(fullImageSet[i]);
        fragment.appendChild(imgElement);
      }
      
      galleryContainer.appendChild(fragment);
      currentIndex = end;
      updateStatus();
      isLoading = false;
      
      // after loading new images, if lightbox is not open it's fine.
      // optional: smooth scroll to bottom hint? but not needed
    }, 20); // tiny delay for responsiveness
  }

  // initial load: first 10 images
  function initialLoad() {
    // reset gallery
    galleryContainer.innerHTML = "";
    currentIndex = 0;
    isLoading = false;
    // load first batch (10)
    const firstBatchCount = Math.min(BATCH_SIZE, fullImageSet.length);
    if (firstBatchCount === 0) return;
    
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < firstBatchCount; i++) {
      const img = createImageElement(fullImageSet[i]);
      fragment.appendChild(img);
    }
    galleryContainer.appendChild(fragment);
    currentIndex = firstBatchCount;
    updateStatus();
    
    // If total images <= 10, disable load more automatically
    if (currentIndex >= fullImageSet.length) {
      loadBtn.disabled = true;
      loadBtn.style.opacity = "0.6";
      loadBtn.innerText = "✨ 已加载全部 ✨";
      if (fullImageSet.length === 0) endMessageDiv.innerText = "✨ 等待照片 ✨";
      else endMessageDiv.innerText = "🌸 所有婚礼影像已呈现，愿爱永驻 🌸";
    } else {
      loadBtn.disabled = false;
      loadBtn.style.opacity = "1";
      loadBtn.innerText = `✨ 加载更多照片 +${Math.min(BATCH_SIZE, fullImageSet.length - currentIndex)} ✨`;
      endMessageDiv.innerText = "";
    }
  }

  // Lightbox close handlers
  function closeLightbox() {
    lightbox.style.display = "none";
    lightboxImg.src = ""; // optional clear
  }
  
  closeBtn.onclick = closeLightbox;
  lightbox.onclick = (e) => {
    if (e.target === lightbox) closeLightbox();
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lightbox.style.display === "flex") {
      closeLightbox();
    }
  });

  // load more button event
  loadBtn.onclick = () => {
    if (currentIndex >= fullImageSet.length) {
      updateStatus();
      return;
    }
    loadNextBatch();
  };

  // initialize gallery on page load
  initialLoad();
</script>
