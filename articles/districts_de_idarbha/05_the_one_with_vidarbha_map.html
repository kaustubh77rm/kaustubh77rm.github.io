<!DOCTYPE html>
<html>
<head>
<title>Vidarbha</title>

<style>

a {
  font-size:20px;
  padding:20px;
}

body {
  background-color: #111;
  color: #FFF;
  padding: 120px 0 0 0;
  margin-top: 1px;
  text-align: center;
}

/* 🔥 SVG FIRE TEXT */
.fire-container {
  width: 100%;
  margin-bottom: 20px;
}

svg {
  width: 80%;
  max-width: 700px;
}

.text {
  fill: none;
  stroke: #222;
  stroke-width: 2;
}

.fire-stroke {
  fill: none;
  stroke: url(#fireGradient);
  stroke-width: 2;

  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;

  animation: drawLoop 5s linear infinite,
             glow 2s ease-in-out infinite alternate;
}

/* LOOPING TRACE */
@keyframes drawLoop {
  0% { stroke-dashoffset: 1000; }
  80% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 1000; }
}

/* GLOW EFFECT */
@keyframes glow {
  0% {
    filter: drop-shadow(0 0 3px #ffae00)
            drop-shadow(0 0 8px #ff5e00);
  }
  100% {
    filter: drop-shadow(0 0 8px #ffae00)
            drop-shadow(0 0 20px #ff0000);
  }
}

img {
  margin-top: 20px;
  max-width: 90%;
}

/* Floating Glass Button */
.nav-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 10px 20px;
  font-size: 1.2em;
  letter-spacing: 0.15em;
  color: #ffffff;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-radius: 30px;
  border: 2px solid rgba(255,255,255,0.25);
  transition: all 0.35s ease;
  z-index: 999;
}

.nav-btn:hover {
  background: rgba(255,140,0,0.25);
  box-shadow: 0 0 18px rgba(255,140,0,0.7);
  transform: translateX(-6px);
}

@media (max-width: 600px) {
  .nav-btn {
    padding: 8px 16px;
    font-size: 0.75em;
  }
}

</style>
</head>

<body>


<div class="content">

  <!-- 🔥 FIRE TEXT -->
  <div class="fire-container">
    <svg viewBox="0 0 800 150">

      <defs>
        <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fff"/>
          <stop offset="20%" stop-color="#ffae00"/>
          <stop offset="40%" stop-color="#ff5e00"/>
          <stop offset="60%" stop-color="#ff0000"/>
          <stop offset="100%" stop-color="#ffae00"/>
        </linearGradient>
      </defs>

      <text x="20" y="100" font-size="80" font-family="Arial" class="text">
        VIDARBHA
      </text>

      <text x="20" y="100" font-size="80" font-family="Arial" class="fire-stroke">
        VIDARBHA
      </text>

    </svg>
  </div>

  <!-- MAP IMAGE -->
  <img src="Vidarbha-region-of-Maharashtra.png" usemap="#image-map">

</div>

<!-- YOUR MAP (UNCHANGED) -->
<map name="image-map">
  <!-- keep all your area tags exactly same -->
</map>

</body>
</html>
